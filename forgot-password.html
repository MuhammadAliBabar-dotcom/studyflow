<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudyFlow - Forgot Password</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .back {
            text-align: center;
            margin-top: 20px;
            color: #777;
        }

        .back a {
            color: #222;
            font-weight: bold;
            text-decoration: none;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }
    </style>

</head>

<body>

    <div class="box">

        <div class="logo">
            📚 StudyFlow
        </div>

        <p class="subtitle">
            Reset your StudyFlow password
        </p>

        <form id="forgotForm">

            <label>Email</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <button
                type="submit"
                id="resetButton"
            >
                Send Reset Email
            </button>

        </form>

        <p id="message"></p>

        <div class="back">
            Remember your password?
            <a href="login.html">
                Login
            </a>
        </div>

    </div>


    <!-- Supabase library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Supabase connection -->
    <script src="supabase.js"></script>


    <script>

        const forgotForm =
            document.getElementById("forgotForm");

        forgotForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                const email =
                    document.getElementById("email")
                        .value.trim();

                const message =
                    document.getElementById("message");

                const resetButton =
                    document.getElementById("resetButton");

                message.textContent =
                    "Sending reset email...";

                resetButton.disabled = true;

                const {
                    error
                } =
                    await supabaseClient.auth
                        .resetPasswordForEmail(
                            email,
                            {
                                redirectTo:
                                    window.location.origin +
                                    "/reset-password.html"
                            }
                        );

                resetButton.disabled = false;

                if (error) {

                    console.error(error);

                    message.textContent =
                        error.message;

                    return;
                }

                message.textContent =
                    "Reset email sent! Check your email and open the reset link.";

            }
        );

    </script>

</body>

</html>
